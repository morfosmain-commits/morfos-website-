<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Client portal — MORFOS</title>
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#050505" />
<style>

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#000000;
  --surface:#121014;
  --surface-raised:#1c181d;
  --line:#2c262b;
  --line-soft:#1e1a1e;
  --ink:#f5f2ee;
  --ink-muted:#a79fa6;
  --ink-faint:#6f6870;
  --red:#fd2702;
  --red-soft:rgba(253,39,2,0.12);
  --amber:#e0a526;
  --amber-soft:rgba(224,165,38,0.14);
  --green:#35b37e;
  --green-soft:rgba(53,179,126,0.14);
  --slate:#8a8fa3;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Public Sans',-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --radius-lg:16px;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
::selection{background:var(--red);color:#fff;}
a{color:inherit;}
img{max-width:100%;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;} }

.wrap{max-width:960px;margin:0 auto;padding:0 20px 90px;position:relative;}

/* ---- Demo ribbon ---- */
.demo-ribbon{background:var(--amber-soft);color:var(--amber);border-bottom:1px solid rgba(224,165,38,.3);text-align:center;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;padding:8px 16px;text-transform:uppercase;}

/* ---- Topbar ---- */
.topbar{display:flex;align-items:center;gap:12px;padding:26px 20px 0;max-width:960px;margin:0 auto;}
.topbar img.cocoon{height:30px;width:auto;}
.topbar img.wordmark{height:17px;width:auto;margin-top:2px;}
.topbar .divider{width:1px;height:22px;background:var(--line);}
.topbar .label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);}

/* ---- Butterfly ----
   The inline mark and the one-shot hero flight are both gone: the travelling
   butterfly at the end of this file does both jobs, and two butterflies on
   one screen read as a mistake. .perch is kept because the heading still
   wants the butterfly to be able to land beside it. */
.perch{display:inline-flex;align-items:center;gap:9px;}

/* the travelling butterfly — the home page's rules, verbatim */
.flit{
  position:fixed;left:0;top:0;z-index:36;
  width:58px;height:69px;
  pointer-events:none;
  opacity:0;
  will-change:transform,opacity;
  transition:opacity .45s ease;
  filter:drop-shadow(0 2px 7px rgba(0,0,0,.85))
         drop-shadow(0 0 14px rgba(253,39,2,.45));
}
.flit canvas{width:100%;height:100%;display:block}
.flit.on{opacity:1}
@media (max-width:760px){ .flit{width:42px;height:50px} }
@media (prefers-reduced-motion:reduce){ .flit{display:none} }

/* ---- Hero ---- */
.hero{padding:34px 0 8px;position:relative;overflow:hidden;}
.hero-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:10px;}
.hero h1{font-family:var(--font-display);font-weight:600;font-size:clamp(28px,5vw,42px);margin:0 0 14px;text-wrap:balance;}
.hero-meta{display:flex;flex-wrap:wrap;gap:26px;margin-top:22px;padding-top:20px;border-top:1px solid var(--line-soft);}
.hm-item{font-size:12.5px;color:var(--ink-faint);}
.hm-item b{display:block;color:var(--ink);font-size:14.5px;font-weight:600;margin-top:3px;font-family:var(--font-mono);}
.day-badge{display:inline-flex;align-items:center;gap:8px;background:var(--red-soft);color:#ff8a70;border:1px solid rgba(253,39,2,.3);padding:6px 14px;border-radius:20px;font-family:var(--font-mono);font-size:12.5px;font-weight:600;margin-bottom:18px;}
.day-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--red);}

.intro-note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:14px;color:var(--ink-muted);margin-top:22px;line-height:1.6;}
.intro-note b{color:var(--ink);}

/* ---- Section heading ---- */
.section{margin-top:52px;}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.section-head h2{font-family:var(--font-display);font-weight:600;font-size:21px;margin:0;}
.section-head .count-note{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);margin-left:auto;}
/* On a phone the heading wraps to two lines and the note sits hard against
   it, which left the butterfly a 2px gap to land in — measured, the mark's
   box ended at 131 and the note began at 133, so the idle drift put it on the
   words. The note takes its own line below instead, which the butterfly needs
   and the note does not mind. */
@media (max-width:760px){
  .section-head{flex-wrap:wrap;}
  .section-head .count-note{margin-left:0;flex-basis:100%;}
}

/* ---- Tabs ---- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-soft);margin:4px 0 24px;overflow-x:auto;}
.tab{font-family:var(--font-body);font-size:13.5px;font-weight:600;color:var(--ink-muted);background:none;border:none;padding:10px 4px;margin-right:26px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--ink);border-bottom-color:var(--red);}
.tab:hover{color:var(--ink);}
.pane{display:none;}
.pane.active{display:block;}

/* ---- Progress ---- */
.progress-wrap{margin-bottom:20px;}
.progress-label{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);margin-bottom:7px;display:flex;justify-content:space-between;}
.progress-track{width:100%;height:6px;border-radius:20px;background:var(--surface-raised);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--red),#ff8a4d);border-radius:20px;}

/* ---- Board (read only, responsive columns) ---- */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media (max-width:820px){.board{grid-template-columns:1fr 1fr;}}
@media (max-width:520px){.board{grid-template-columns:1fr;}}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:12px;}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 12px;}
.col-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:7px;color:var(--ink-muted);}
.dot{width:7px;height:7px;border-radius:50%;flex:none;}
.dot.todo{background:var(--slate);} .dot.progress{background:#5b9bf0;} .dot.waiting{background:var(--amber);} .dot.done{background:var(--green);}
.count{font-family:var(--font-mono);font-size:10px;font-weight:600;background:var(--surface-raised);color:var(--ink-muted);padding:2px 7px;border-radius:20px;}
.col-body{display:flex;flex-direction:column;gap:8px;min-height:20px;}
.col-empty{font-size:11px;color:var(--ink-faint);text-align:center;padding:14px 4px;}
.card{background:var(--surface-raised);border:1px solid var(--line);border-left:3px solid var(--slate);border-radius:9px;padding:10px 11px;font-size:12.5px;line-height:1.4;}
.col.todo .card{border-left-color:var(--slate);}
.col.progress .card{border-left-color:#5b9bf0;}
.col.waiting .card{border-left-color:var(--amber);}
.col.done .card{border-left-color:var(--green);opacity:.72;}
.col.done .card .card-title{text-decoration:line-through;text-decoration-color:var(--ink-faint);}
.col.waiting{background:rgba(224,165,38,.05);border-color:rgba(224,165,38,.25);}
.card-title{font-weight:600;color:var(--ink);}
.card-sub{font-size:11px;color:var(--ink-muted);margin-top:3px;}
.card-tags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;}
.tag{font-family:var(--font-mono);font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:20px;}
.tag.day{background:var(--surface);color:var(--ink-muted);border:1px solid var(--line);}
.tag.need{background:var(--amber-soft);color:var(--amber);}

/* ---- Link cards (deliverables / documents) ---- */
.link-grid{display:flex;flex-direction:column;gap:10px;}
.link-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 17px;text-decoration:none;transition:border-color .15s ease,background .15s ease;}
.link-card:hover{border-color:#3a333a;background:var(--surface-raised);}
.link-icon{width:36px;height:36px;border-radius:9px;background:var(--red-soft);color:#ff8a70;display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--font-mono);font-size:14px;}
.link-body{flex:1;min-width:0;}
.link-title{font-weight:600;font-size:14px;color:var(--ink);}
.link-note{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.link-go{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);flex:none;}

/* ---- Footer ---- */
footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--line-soft);text-align:center;color:var(--ink-faint);font-size:12.5px;}
footer .fnames{color:var(--ink-muted);margin-top:4px;}

/* ---- PIN gate ---- */
.gate{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;}
.gate.unlocked{display:none;}
.gate-card{max-width:340px;width:100%;text-align:center;}
.gate-card img.cocoon{height:44px;margin-bottom:18px;}
.gate-card h1{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0 0 6px;}
.gate-card p{color:var(--ink-muted);font-size:13px;margin:0 0 22px;}
.pin-input{margin-bottom:16px;}
.pin-input input{
  width:100%;height:56px;text-align:center;font-family:var(--font-mono);font-size:24px;font-weight:600;letter-spacing:.35em;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--ink);
}
.pin-input input::placeholder{color:var(--ink-faint);letter-spacing:.35em;}
.pin-input input:focus{outline:none;border-color:var(--red);}
.gate-error{color:#ff8a70;font-size:12.5px;min-height:18px;margin-bottom:10px;}
.gate-btn{font:inherit;font-weight:600;font-size:13.5px;padding:11px 20px;border-radius:9px;border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer;width:100%;}
.gate-btn:hover{background:#e42200;}
.gate-hint{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);margin-top:18px;}

.content{opacity:0;}
.content.revealed{opacity:1;animation:fadein .5s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ---- additions for the multi-client portal ---- */
.topbar .back-link{
  margin-left:auto;font-family:var(--font-mono);font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);
  text-decoration:none;transition:color .15s ease;
}
.topbar .back-link:hover{color:var(--ink);}
.section-head .perch h2{
  font-family:var(--font-display);font-weight:600;font-size:21px;margin:0;
}
[hidden]{display:none !important;}
</style>
</head>

var COL_LABELS = { todo:"To do", progress:"In progress", waiting:"Waiting on you", done:"Done" };
var COL_ORDER = ["todo","progress","waiting","done"];

function escapeHtml(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function $(id){ return document.getElementById(id); }

async function sha256Hex(text){
  var enc = new TextEncoder().encode(text);
  var buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf))
    .map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
}

// so a PIN can be turned into a hash without leaving the page
window.morfosPin = function(pin){
  return sha256Hex(String(pin)).then(function(h){
    console.log("pinHash for " + pin + ":\n" + h);
    return h;
  });
};

function renderBoard(cards){
  var board = $("board");
  board.innerHTML = "";
  COL_ORDER.forEach(function(col){
    var items = cards.filter(function(c){ return c.col === col; });
    var colEl = document.createElement("div");
    colEl.className = "col " + col;
    var body = items.map(function(c){
      var tags = '<span class="tag day">Day ' + escapeHtml(c.day) + '</span>'
        + (c.need ? '<span class="tag need">' + escapeHtml(c.need) + '</span>' : '');
      return '<div class="card"><div class="card-title">' + escapeHtml(c.title) + '</div>'
        + (c.sub ? '<div class="card-sub">' + escapeHtml(c.sub) + '</div>' : '')
        + '<div class="card-tags">' + tags + '</div></div>';
    }).join("") || '<div class="col-empty">Nothing here yet.</div>';
    colEl.innerHTML = '<div class="col-head"><div class="col-title"><span class="dot ' + col + '"></span>'
      + COL_LABELS[col] + '</div><div class="count">' + items.length + '</div></div>'
      + '<div class="col-body">' + body + '</div>';
    board.appendChild(colEl);
  });

  var total = cards.length;
  var done = cards.filter(function(c){ return c.col === "done"; }).length;
  var pct = total ? Math.round(done / total * 100) : 0;
  $("progress-text").textContent = done + " / " + total + " done";
  $("progress-pct").textContent = pct + "%";
  $("progress-fill").style.width = pct + "%";
  $("progress-note").textContent = "Updated by Morfos as work happens";
}

function renderLinks(gridId, items, iconLabel){
  var grid = $(gridId);
  grid.innerHTML = "";
  if (!items || !items.length){
    grid.innerHTML = '<div style="color:var(--ink-faint);font-size:13px;">Nothing here yet.</div>';
    return;
  }
  items.forEach(function(it){
    var a = document.createElement("a");
    a.href = it.url || "#";
    a.target = "_blank"; a.rel = "noopener";
    a.className = "link-card";
    a.innerHTML = '<div class="link-icon">' + iconLabel + '</div>'
      + '<div class="link-body"><div class="link-title">' + escapeHtml(it.label) + '</div>'
      + (it.note ? '<div class="link-note">' + escapeHtml(it.note) + '</div>' : '') + '</div>'
      + '<div class="link-go">Open →</div>';
    grid.appendChild(a);
  });
}

function renderClient(c){
  document.title = c.name + " — Morfos";
  $("client-name").textContent = c.name;
  $("day-badge-text").textContent = c.dayBadge || "";
  $("day-badge").hidden = !c.dayBadge;
  $("intro-note").textContent = c.intro || "";
  $("intro-note").hidden = !c.intro;
  $("demo-ribbon").hidden = !c.demo;
  $("foot-names").textContent = CONTACTS;

  var meta = $("hero-meta");
  meta.innerHTML = "";
  (c.meta || []).forEach(function(m){
    var d = document.createElement("div");
    d.className = "hm-item";
    d.innerHTML = escapeHtml(m.label) + "<b>" + escapeHtml(m.value) + "</b>";
    meta.appendChild(d);
  });

  renderBoard(c.cards || []);
  renderLinks("deliverables-grid", c.deliverables, "↓");
  renderLinks("documents-grid", c.documents, "▤");
}

function unlock(c){
  renderClient(c);
  $("gate").classList.add("unlocked");
  $("content").classList.add("revealed");
}

function wireGate(){
  var input = $("pin-single");
  var btn = $("gate-submit");
  var err = $("gate-error");

  input.addEventListener("input", function(){
    input.value = input.value.replace(/[^0-9]/g, "").slice(0, 6);
    err.textContent = "";
  });
  input.addEventListener("keydown", function(e){
    if (e.key === "Enter") btn.click();
  });

  btn.addEventListener("click", async function(){
    var pin = input.value.trim();
    if (pin.length < 4){
      err.textContent = "Enter your PIN, then press Unlock.";
      return;
    }
    btn.disabled = true;
    var hash = await sha256Hex(pin);
    btn.disabled = false;

    // whichever client's hash matches is the build we open
    var match = null;
    for (var i = 0; i < CLIENTS.length; i++){
      if (CLIENTS[i].pinHash === hash){ match = CLIENTS[i]; break; }
    }
    if (match){
      unlock(match);
    } else {
      err.textContent = "That PIN doesn't match. Check the message from Morfos and try again.";
      input.value = "";
      input.focus();
    }
  });

  input.focus();
}

function wireTabs(){
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  tabs.forEach(function(t){
    t.addEventListener("click", function(){
      tabs.forEach(function(x){ x.classList.toggle("active", x === t); });
      Array.prototype.slice.call(document.querySelectorAll(".pane")).forEach(function(p){
        p.classList.toggle("active", p.id === t.dataset.pane);
      });
    });
  });
}

wireTabs();
wireGate();

window.__portal = {
  get clients(){ return CLIENTS.map(function(c){ return c.slug; }); },
  get locked(){ return !$("gate").classList.contains("unlocked"); },
  open: function(slug){
    var c = CLIENTS.filter(function(x){ return x.slug === slug; })[0];
    if (c) unlock(c);
    return !!c;
  },
  hash: sha256Hex
};

})();

</script>
<!-- The butterfly that travels the page, lifted from the home page so the
     portal reads as the same site. -->
<div class="flit" id="flit" aria-hidden="true"></div>

<script>
/* ===================================================================
   The travelling butterfly — the same one the home page runs.

   Het: "i want the client portal butterfly to be replaced by our home page
   small butterfly, it should be moving in the same manner as it is in home
   page ... the small butterfly that is travelling through sections to
   sections."

   So the seat solve, the spring, the flight arc and the wing beat below are
   the home page's, unchanged, and only what is specific to that page has
   been swapped out: the drawing comes with it (the portal has no hero canvas
   to borrow it from), the corner-logo dock and the hero handoff are gone
   (the portal has neither), and it is held while the PIN gate is up.

   If the drawing on the home page is ever retuned, re-copy the three routines
   below with it — they are the same code, not a second version of it.
=================================================================== */
(() => {
  "use strict";

  // one wing as a tapered petal, root at (0,0) sweeping to (len, 0) before rotation
  function wingPath(g, len, spread, curl) {
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(len * 0.22, -spread * 0.95, len * 0.68, -spread * 1.05, len, -spread * curl);
    g.bezierCurveTo(len * 1.06, -spread * 0.16, len * 0.98, spread * 0.30, len * 0.72, spread * 0.62);
    g.bezierCurveTo(len * 0.44, spread * 0.92, len * 0.16, spread * 0.55, 0, 0);
    g.closePath();
  }

  function drawWing(g, cfg) {
    const { x, y, rot, len, spread, curl, bright } = cfg;
    g.save();
    g.translate(x, y);
    g.rotate(rot);

    // --- membrane ---
    wingPath(g, len, spread, curl);
    const grd = g.createLinearGradient(0, 0, len, -spread * 0.4);
    grd.addColorStop(0,    `rgba(255,110,96,${0.85 * bright})`);
    grd.addColorStop(0.13, `rgba(253,39,2,${0.80 * bright})`);
    grd.addColorStop(0.42, `rgba(176,27,2,${0.72 * bright})`);
    grd.addColorStop(0.78, `rgba(104,16,1,${0.62 * bright})`);
    grd.addColorStop(1,    `rgba(52,8,1,${0.50 * bright})`);
    g.fillStyle = grd;
    g.fill();

    // --- veins, clipped inside the membrane ---
    g.save();
    wingPath(g, len, spread, curl);
    g.clip();
    g.lineWidth = 0.9;
    const veins = 34;
    for (let i = 0; i <= veins; i++) {
      const t = i / veins;
      const ey = -spread * curl * (1 - t) + spread * 0.62 * t;
      g.beginPath();
      g.moveTo(0, 0);
      g.bezierCurveTo(len * 0.34, ey * 0.55, len * 0.70, ey * 0.86, len * 1.02, ey);
      g.strokeStyle = `rgba(255,${70 + Math.round(70 * t)},${56 + Math.round(64 * t)},${(0.16 + 0.12 * Math.sin(t * Math.PI)) * bright})`;
      g.stroke();
    }
    // cross-ribs
    for (let i = 1; i < 5; i++) {
      const t = i / 5;
      g.beginPath();
      g.moveTo(len * t, -spread * curl * (1 - t) * 0.9);
      g.quadraticCurveTo(len * t * 1.04, 0, len * t, spread * 0.6 * t);
      g.strokeStyle = `rgba(253,60,40,${0.07 * bright})`;
      g.stroke();
    }

    // --- hot core near the wing root ---
    const core = g.createRadialGradient(len * 0.08, 0, 0, len * 0.08, 0, len * 0.42);
    core.addColorStop(0,   `rgba(255,150,132,${0.55 * bright})`);
    core.addColorStop(0.3, `rgba(253,50,18,${0.32 * bright})`);
    core.addColorStop(1,   "rgba(253,39,2,0)");
    g.fillStyle = core;
    g.fillRect(-len * 0.1, -spread, len * 1.2, spread * 2);

    // --- embers, scattered by rejection sampling inside the membrane ---
    wingPath(g, len, spread, curl);          // current path = hit-test shape
    // isPointInPath reads untransformed canvas coordinates, so map through the CTM
    const M = g.getTransform();
    const pts = [];
    let tries = 0;
    while (pts.length < 52 && tries++ < 900) {
      // biased toward the root, where the wing runs hottest
      const ex = len * Math.pow(Math.random(), 0.72) * 1.02;
      const ey = (Math.random() * 2 - 1) * spread * 1.05;
      const dx = M.a * ex + M.c * ey + M.e;
      const dy = M.b * ex + M.d * ey + M.f;
      if (g.isPointInPath(dx, dy)) pts.push([ex, ey]);
    }
    for (const [ex, ey] of pts) {
      const heat = Math.random();
      const rr = (Math.random() * 1.9 + 0.45) * (heat > 0.8 ? 1.6 : 1);
      const eg = g.createRadialGradient(ex, ey, 0, ex, ey, rr * 3.6);
      eg.addColorStop(0, heat > 0.55 ? `rgba(255,158,140,${0.95 * bright})` : `rgba(253,70,52,${0.9 * bright})`);
      eg.addColorStop(0.32, `rgba(253,45,12,${0.40 * bright})`);
      eg.addColorStop(1, "rgba(253,39,2,0)");
      g.fillStyle = eg;
      g.beginPath();
      g.arc(ex, ey, rr * 3.6, 0, Math.PI * 2);
      g.fill();
    }
    g.restore();

    // --- rim light along the leading edge ---
    wingPath(g, len, spread, curl);
    g.lineWidth = 1.15;
    const rim = g.createLinearGradient(0, 0, len, 0);
    rim.addColorStop(0,   `rgba(255,140,128,${0.55 * bright})`);
    rim.addColorStop(0.5, `rgba(253,39,2,${0.34 * bright})`);
    rim.addColorStop(1,   `rgba(150,23,2,${0.16 * bright})`);
    g.strokeStyle = rim;
    g.stroke();

    g.restore();
  }

  function drawButterfly(g, bx, by, S) {
    g.save();
    g.translate(bx, by);
    g.globalCompositeOperation = "lighter";

    const U = S * 0.40;   // upper wing length
    const L = S * 0.34;   // lower wing length

    // The near (left) pair is large and sweeps up and back; the far (right)
    // pair is foreshortened. Roots sit either side of the body, not on one
    // point, so the silhouette reads as a butterfly rather than a flower.
    const lx = -S * 0.026, rx = S * 0.026;

    // far side first, so the near wing overlaps it
    drawWing(g, { x: rx, y: -S * 0.004, rot: -0.30, len: U * 1.02, spread: U * 0.38, curl: 0.90, bright: 0.90 });
    drawWing(g, { x: rx, y:  S * 0.014, rot:  0.66, len: L * 0.96, spread: L * 0.42, curl: 0.64, bright: 0.74 });
    drawWing(g, { x: rx, y:  S * 0.020, rot:  1.16, len: L * 0.62, spread: L * 0.28, curl: 0.54, bright: 0.48 });

    drawWing(g, { x: lx, y:  S * 0.006, rot: -2.02, len: U * 1.02, spread: U * 0.46, curl: 0.78, bright: 0.72 });
    drawWing(g, { x: lx, y: -S * 0.012, rot: -2.38, len: U * 1.34, spread: U * 0.56, curl: 0.94, bright: 1.00 });
    drawWing(g, { x: lx, y:  S * 0.018, rot:  2.54, len: L * 1.22, spread: L * 0.54, curl: 0.74, bright: 0.86 });
    drawWing(g, { x: lx, y:  S * 0.024, rot:  2.10, len: L * 0.82, spread: L * 0.36, curl: 0.60, bright: 0.56 });

    // --- body: a tapered abdomen with a glossy thorax, tilted like the pose ---
    const bodyH = S * 0.150;
    g.save();
    g.rotate(0.30);

    const bg2 = g.createLinearGradient(-S * 0.02, -bodyH * 0.5, S * 0.02, bodyH * 0.6);
    bg2.addColorStop(0,   "rgba(255,150,132,.95)");
    bg2.addColorStop(0.30,"rgba(253,39,2,.92)");
    bg2.addColorStop(0.72,"rgba(160,25,2,.88)");
    bg2.addColorStop(1,   "rgba(62,10,1,.82)");
    g.fillStyle = bg2;
    g.beginPath();
    g.ellipse(0, bodyH * 0.14, S * 0.0205, bodyH * 0.50, 0, 0, Math.PI * 2);
    g.fill();

    // segment banding down the abdomen
    g.lineWidth = 0.9;
    for (let i = 1; i < 6; i++) {
      const sy = -bodyH * 0.22 + (bodyH * 0.72) * (i / 6);
      const hw = S * 0.0200 * Math.cos((i / 6 - 0.2) * 1.5);
      g.beginPath();
      g.moveTo(-hw, sy);
      g.quadraticCurveTo(0, sy + S * 0.005, hw, sy);
      g.strokeStyle = `rgba(44,7,1,${0.42 - i * 0.05})`;
      g.stroke();
    }

    // thorax + specular bead
    const th = g.createRadialGradient(-S * 0.004, -bodyH * 0.40, 0, 0, -bodyH * 0.36, S * 0.026);
    th.addColorStop(0, "rgba(255,164,146,.98)");
    th.addColorStop(0.4, "rgba(253,50,20,.92)");
    th.addColorStop(1, "rgba(178,28,2,.80)");
    g.fillStyle = th;
    g.beginPath();
    g.arc(0, -bodyH * 0.36, S * 0.023, 0, Math.PI * 2);
    g.fill();

    g.fillStyle = "rgba(255,170,152,.9)";
    g.beginPath();
    g.arc(-S * 0.006, -bodyH * 0.43, S * 0.0072, 0, Math.PI * 2);
    g.fill();
    g.restore();

    // --- antennae: two long tapering curves off the thorax ---
    const ah = -bodyH * 0.46;
    g.lineCap = "round";
    [
      { c1x: 0.055, c1y: -0.150, c2x: 0.086, c2y: -0.250, ex: 0.070, ey: -0.315, w: 1.35 },
      { c1x: 0.110, c1y: -0.105, c2x: 0.168, c2y: -0.140, ex: 0.196, ey: -0.150, w: 1.15 }
    ].forEach(a => {
      g.beginPath();
      g.moveTo(S * 0.008, ah);
      g.bezierCurveTo(S * a.c1x, S * a.c1y, S * a.c2x, S * a.c2y, S * a.ex, S * a.ey);
      const ag = g.createLinearGradient(0, ah, S * a.ex, S * a.ey);
      ag.addColorStop(0, "rgba(254,100,86,.85)");
      ag.addColorStop(1, "rgba(205,32,2,.30)");
      g.strokeStyle = ag;
      g.lineWidth = a.w;
      g.stroke();
    });

    g.restore();
  }

  /* The hero's butterfly, drawable at any size into any context. On the home
     page this also accepts a supplied image; the portal only ever draws. */
  function drawArt(g, bx, by, box) { drawButterfly(g, bx, by, box); }

  const host = document.getElementById("flit");
  if (!host) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  /* ---------- the mark ----------
     This used to be flat SVG line work while the hero's was a drawn object —
     seven wings in a near and a far pair, the far one foreshortened, a lit
     body with banding and a thorax bead, antennae. Same creature, so it is
     now the same drawing: the hero exposes the routine and this renders it
     into a sprite at its own size.

     Drawn LARGE and scaled down by the context, never called with a small
     size. The routine sets absolute line widths — 0.9px for the abdomen
     banding, 1.15 to 1.35px for the antennae — and those are in the context's
     units, not fractions of the butterfly. Asking it for a 58px butterfly
     would keep them at full weight against a tenth of the geometry and the
     miniature would come out drawn with a marker pen. Drawing at 420 and
     scaling the whole context down keeps every proportion the hero's has. */
  const S_DRAW = 420;
  let MARK_FRAC, flap;

  {
    /* Measured once, at the size it is drawn at, so the sprite is fitted to
       the drawing rather than to a guess about it. Alpha > 8 is the same
       threshold the hero measures its own art box with. */
    const probe = document.createElement("canvas");
    probe.width = probe.height = Math.ceil(S_DRAW * 1.7);
    const pg = probe.getContext("2d");
    const PO = probe.width / 2;
    drawArt(pg, PO, PO, S_DRAW);
    const pd = pg.getImageData(0, 0, probe.width, probe.height).data;
    let bx0 = 1e9, by0 = 1e9, bx1 = -1, by1 = -1;
    for (let y = 0; y < probe.height; y++) {
      for (let x = 0; x < probe.width; x++) {
        if (pd[(y * probe.width + x) * 4 + 3] > 8) {
          if (x < bx0) bx0 = x; if (x > bx1) bx1 = x;
          if (y < by0) by0 = y; if (y > by1) by1 = y;
        }
      }
    }
    const bw = Math.max(1, bx1 - bx0), bh = Math.max(1, by1 - by0);
    const offX = (bx0 + bx1) / 2 - PO, offY = (by0 + by1) / 2 - PO;

    const cvs = document.createElement("canvas");
    host.replaceChildren(cvs);
    const g = cvs.getContext("2d");
    MARK_FRAC = 0.92;

    /* The drawn width, which is what it has always been on screen. The BOX is
       larger than that because the dark halo needs somewhere to live, and the
       box is re-shaped to the drawing: the flat mark was taller than wide, the
       drawing is the other way round, measured 144 by 114. Not cosmetic — this
       box is what the text avoidance tests against, and a box two thirds empty
       makes the butterfly refuse perfectly good places to sit. */
    /* The drawn width on screen. It used to be a flat 54 and the butterfly
       never ran on a phone at all, so nothing tested it there; at 54 on a
       375px screen the mark is a seventh of the width and lands on the
       headings it is supposed to sit beside. 38 keeps the same relationship
       to the text that 54 has on a desktop. Read inside sprite(), which
       re-runs on resize, so rotating the phone re-fits it. */
    const markCss = () => innerWidth < 761 ? 38 : 54;
    const HALO = 0.16;
    const tmp = document.createElement("canvas");
    const tg = tmp.getContext("2d");
    const canBlur = typeof g.filter === "string";

    function sprite() {
      const boxW = Math.round(markCss() * (1 + 2 * HALO));
      const boxH = Math.max(2, Math.round(boxW * bh / bw));
      host.style.width = boxW + "px";
      host.style.height = boxH + "px";
      /* rendered above device resolution: at 54px across, the antennae and
         the abdomen banding are sub-pixel, and supersampling is what keeps
         them from disappearing into aliasing */
      const dpr = Math.min((window.devicePixelRatio || 1) * 2, 4);
      cvs.width = Math.round(boxW * dpr); cvs.height = Math.round(boxH * dpr);
      const k = Math.min(cvs.width / (bw * (1 + 2 * HALO)),
                         cvs.height / (bh * (1 + 2 * HALO)));
      const ox = cvs.width / (2 * k) - offX, oy = cvs.height / (2 * k) - offY;

      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, cvs.width, cvs.height);

      /* A dark halo under the drawing — the same job the flat mark's
         page-coloured stroke used to do, and it is needed: measured against
         the brand red of a .btn the drawing on its own came out at 1.02:1 and
         disappeared. It is drawn in the page colour, so on the page it cannot
         be seen; the element's own drop shadow sits too far out and too soft
         to do this, because the shadow of a soft glow is a soft shadow. */
      if (canBlur) {
        tmp.width = cvs.width; tmp.height = cvs.height;
        tg.setTransform(k, 0, 0, k, 0, 0);
        drawArt(tg, ox, oy, S_DRAW);
        tg.setTransform(1, 0, 0, 1, 0, 0);
        tg.globalCompositeOperation = "source-in";
        tg.fillStyle = "#050205";
        tg.fillRect(0, 0, cvs.width, cvs.height);
        tg.globalCompositeOperation = "source-over";
        g.filter = "blur(" + Math.max(1, cvs.width * 0.045).toFixed(1) + "px)";
        /* stamped repeatedly rather than once: one pass of a blurred soft
           alpha is far too faint to separate anything */
        for (let i = 0; i < 5; i++) g.drawImage(tmp, 0, 0);
        g.filter = "none";
      }

      // and the drawing itself, which adds its own light over the halo
      g.setTransform(k, 0, 0, k, 0, 0);
      drawArt(g, ox, oy, S_DRAW);
      MARK_FRAC = (bw * k) / cvs.width;
    }
    sprite();
    addEventListener("resize", sprite, { passive: true });
    /* the beat is a horizontal squeeze about the mark's own centre, exactly
       as it was on the group it replaces */
    flap = b => { cvs.style.transform = "scaleX(" + b.toFixed(3) + ")"; };

  }

  /* It used to stop below 861px and hand the mark back to the static corner
     logo, which meant the one thing that ties the page together never ran on
     a phone — where most of the traffic is. It runs at every width now; the
     sprite is smaller there (see markCss) and the seat solve already works in
     viewport units, so nothing else had to change. Reduced motion is still
     honoured — this whole engine returns early above when it is set.

     `wide` stays as the gate the frame loop reads, now always open. */
  const wide = { matches: true };


  /* ---------- where it goes ----------
     From heading to heading. It leaves the corner logo early, and from
     then on the only places it ever comes to rest are the page's own
     headings: it perches at the end of one, rides it while the page
     scrolls, and when that heading leaves the perching band it flies down
     (or up) onto the next one. Crossing text on the way is fine — sitting
     on it is not, which is why the seat is past the END of the line.     */
  /* SECTION HEADINGS ONLY, the same rule the home page holds to: it sits on
     headings, never on body text. The portal's three are the client's name,
     the section title and the sign-off.

     The board's four column heads were in here at first and had to come out.
     The seat goes just past the end of a heading's last line, which works
     when a heading has the rest of the row to itself; a column head does not
     — its own cards are directly under that space. Measured, the "Done" seat
     put the mark on a card's text at scroll 600. Three seats over 1657px is
     denser than the home page's nine over 9000 anyway.

     Read fresh every frame rather than cached: switching tabs changes which
     of these exist, and a hidden pane's headings measure as nothing and drop
     out by themselves. */
  const HEAD_SEL = [
    "#client-name", ".section-head h2", "footer"
  ].join(",");

  /* the home page's corner words needed unwrapping here; the portal's
     headings are ordinary elements */
  const headBox = el => el;

  /* The LAST LINE of a heading, not its block: a two-line title's block
     box ends level with the second line but reaches the full measure, and
     seating off that would put the butterfly in the middle of nowhere. */
  function lastLine(el) {
    let best = null;
    try {
      const rg = document.createRange();
      rg.selectNodeContents(el);
      for (const b of rg.getClientRects()) {
        if (b.width < 0.5 || b.height < 0.5) continue;
        if (!best || b.bottom > best.bottom + 1 ||
            (Math.abs(b.bottom - best.bottom) <= 1 && b.right > best.right)) best = b;
      }
    } catch (err) {}
    const er = el.getBoundingClientRect();
    /* Several of these headings are split into word spans the reveal
       engine slides in, and mid-reveal a word's rect can be a long way
       outside its own block — measured, one of the statement's words
       reported a right edge of 1057 in a 1024 window and the seat was
       clamped off the end of the screen. Keep the line inside the
       element's own box. */
    if (best && er.width > 0.5) {
      const L = Math.max(best.left, er.left), R = Math.min(best.right, er.right);
      const T = Math.max(best.top, er.top),  B = Math.min(best.bottom, er.bottom);
      best = (R > L + 0.5 && B > T + 0.5)
        ? { left: L, top: T, right: R, bottom: B, width: R - L, height: B - T }
        : er;
    }
    if (!best && er.width > 0.5) best = er;
    return best;
  }

  /* The band is the part of the window a heading is allowed to be sat on.
     AIM is only used to choose between two headings that are both inside
     it. */
  const BAND_TOP = 0.06, BAND_BOT = 0.86, AIM = 0.40;
  let perchEl = null;
  let flying = false;          // true while it is between two headings

  /* Every heading on the page with its measured last line, in screen order.
     Nine elements, nine Ranges: measured at 0.032ms a frame, which is a
     twentieth of what one scrollTo costs in the same loop, so this is not
     worth caching at the price of the seat being a frame stale. */
  function heads() {
    const out = [];
    for (const el of document.querySelectorAll(HEAD_SEL)) {
      const box = lastLine(headBox(el) || el);
      if (!box) continue;
      out.push({ el: el, box: box, cy: box.top + box.height / 2 });
    }
    out.sort((a, b) => a.cy - b.cy);
    return out;
  }

  /* The seat for one heading: on its own line, just past its last word, so
     the heading reads clean underneath it. If the line runs to the edge of
     the window there is no room beside it, and it sits just above the line's
     right-hand end instead. `atY` overrides the height — that is how a
     heading that has left the band still yields a point on the band edge to
     blend from. */
  function seatFrom(box, atY) {
    const hw = host.offsetWidth * 0.5, hh = host.offsetHeight * 0.5;
    const M = 12, GAP = 10;
    const cl = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
    let y = atY === undefined ? box.top + box.height / 2 : atY;
    let x = box.right + GAP + hw;
    if (x + hw > innerWidth - M) {
      /* No room beside the line, so it goes clear of it vertically — and it
         takes whichever side has MORE room, not simply the one above.

         This is what the two corner words (WORK and OUR SERVICES) need. They
         finish their migration hard against the right margin, about 80px from
         the top, with the whole panel empty underneath. Always preferring
         above put the mark in the strip between the header and the word:
         at 1600 wide it covered up to six of the twelve letters of OUR
         SERVICES over 24 consecutive scroll samples, and on a 375px phone the
         seat itself was fine but the BLEND down to the next heading's seat
         then dragged the mark straight back through the word — measured at
         seat y 61 rising to 91 against a word occupying 80 to 96. Seating
         below the word means the blend leaves downwards and never crosses it.

         Ties and near-ties go to above, which is what every heading in the
         middle of the page had before and still gets.

         CLEAR is 16 rather than the 6 this used to leave, because the idle
         drift is +/-5.4px vertically: a 6px gap is clear at the seat and not
         clear at the position actually drawn. */
      const CLEAR = 16;
      const above = y - box.height / 2 - hh - CLEAR;
      const below = y + box.height / 2 + hh + CLEAR;
      const fitsAbove = above - hh > M;
      const fitsBelow = below + hh < innerHeight - M;
      const roomAbove = above - hh - M;
      const roomBelow = innerHeight - M - (below + hh);
      const side = Math.min(box.right - hw * 0.2, innerWidth - M - hw);
      if (fitsAbove && (!fitsBelow || roomAbove >= roomBelow)) { x = side; y = above; }
      else if (fitsBelow) { x = side; y = below; }
      else { x = innerWidth - M - hw; }
    }
    return { x: cl(x, M + hw, innerWidth - M - hw),
             y: cl(y, M + hh, innerHeight - M - hh) };
  }

  /* How much of the gap between two headings is spent sitting on each of
     them rather than travelling, and the distance over which a dwell fades
     out as its heading approaches the edge of the band. */
  const DWELL = 0.34, FADE = 0.12;

  function perch() {
    const list = heads();
    const vh = innerHeight;
    const top = vh * BAND_TOP, bot = vh * BAND_BOT, aim = vh * AIM;
    if (!list.length) {
      flying = false;
      return { x: innerWidth - host.offsetWidth * 0.5 - 26,
               y: vh - host.offsetHeight * 0.5 - 26 };
    }

    /* A is the last heading at or above the aim line, B the first below it,
       so the aim line always sits between the two and u below is in range
       by construction. */
    let A = null, B = null;
    for (const h of list) {
      if (h.cy <= aim) A = h;            // sorted, so this ends up the lowest
      else if (!B) B = h;                // and this the highest below
    }
    if (!A && !B) { flying = false; return seatAt(list[0], top, bot); }
    if (!A) { perchEl = B.el; flying = false; return seatAt(B, top, bot); }
    if (!B) { perchEl = A.el; flying = false; return seatAt(A, top, bot); }

    const u = (aim - A.cy) / Math.max(1, B.cy - A.cy);
    /* Each dwell fades as its own heading nears the edge of the band: A's
       goes as A approaches the top, B's is absent until B is properly inside
       the bottom. Without that the butterfly would keep sitting on a heading
       that had already left the screen, which is exactly the edge-pinning
       this replaced. */
    const lo = DWELL * clamp01((A.cy - top) / (vh * FADE));
    const hi = 1 - DWELL * clamp01((bot - B.cy) / (vh * FADE));
    let f = hi > lo ? (u - lo) / (hi - lo) : (u < 0.5 ? 0 : 1);
    f = smooth(clamp01(f));

    perchEl = f < 0.5 ? A.el : B.el;
    flying = f > 0.02 && f < 0.98;
    const a = seatAt(A, top, bot), b = seatAt(B, top, bot);
    return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
  }

  /* A heading's seat, with its height held inside the band. On its own
     line while it is on screen; pinned to the band edge it went out of
     while it is not, so a blend between two of these is always somewhere
     the butterfly can actually be seen. */
  function seatAt(h, top, bot) {
    const y = h.cy < top ? top : h.cy > bot ? bot : h.cy;
    return seatFrom(h.box, y);
  }

  /* A quadratic through the top right, so the flight itself also keeps to
     the margin instead of cutting across the page. */
  function arc(a, b, t) {
    const cx = b.x, cy = Math.max(a.y, 96);      // clear of the header bar
    const u = 1 - t;
    return {
      x: u * u * a.x + 2 * u * t * cx + t * t * b.x,
      y: u * u * a.y + 2 * u * t * cy + t * t * b.y
    };
  }

  /* ---------- state ----------
     px/py are what is DRAWN: the seat plus the spring's offset. The offset
     is the only thing with momentum — the seat itself is followed exactly,
     which is what "sitting on the heading" has to mean. */
  let px = 0, py = 0, ps = 1, rot = 0;
  let started = false, travel = 0;
  let ox = 0, oy = 0, ovx = 0, ovy = 0;
  let lastNow = 0, reseed = false;

  /* A spring-damper rather than a per-frame fraction, so the motion is the
     same at 60, 120 or 8 frames a second. w0 11 rad/s with z 0.9 crosses a
     heading-to-heading gap in about half a second and arrives without a
     wobble; the fixed substep is the same idiom the cursor engine uses. */
  const SP_W = 11, SP_Z = 0.9, SP_SUB = 1 / 240;
  function relax(dt) {
    const k = SP_W * SP_W, c = 2 * SP_Z * SP_W;
    let left = dt;
    while (left > 1e-6) {
      const h = left < SP_SUB ? left : SP_SUB;
      left -= h;
      ovx += (-k * ox - c * ovx) * h; ox += ovx * h;
      ovy += (-k * oy - c * ovy) * h; oy += ovy * h;
    }
  }

  /* ---------- waiting for the gate ----------
     The portal opens on a PIN screen that covers everything. The butterfly
     belongs to the build page behind it, so it is held until that screen has
     gone rather than flying about over the lock.

     The gate's own `unlocked` class is the test, not whether it is laid out:
     it is position:fixed, so offsetParent is null whether it is on screen or
     not, and reading that let the butterfly loose over the PIN screen. */
  const gate = document.getElementById("gate");
  const locked = () => !!gate && !gate.classList.contains("unlocked");

  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const smooth = t => t * t * (3 - 2 * t);

  /* Where it should be right now. On the home page this begins docked on
     the corner logo and flies off it; here there is no logo to leave, so it
     is on a heading from the first frame. */
  function target() {
    const home = perch();
    return { x: home.x, y: home.y, s: 1 };
  }

  function step(now) {
    requestAnimationFrame(step);
    tick(now);
  }

  function tick(now) {
    if (!wide.matches) { started = false; return; }

    if (locked()) { host.classList.remove("on"); started = false; return; }

    // real elapsed time, clamped so a throttled tab cannot fire the spring
    // across the page in one step
    const dt = lastNow ? Math.min(0.1, Math.max(0, (now - lastNow) / 1000)) : 1 / 60;
    lastNow = now;

    const t = target();
    if (!started) {
      px = t.x; py = t.y; ps = t.s; started = true;
      ox = oy = ovx = ovy = 0; reseed = false;
      host.classList.add("on");
    } else if (!reseed && Math.hypot(t.x - px - ox, t.y - py - oy) > 120) {
      /* the seat moved further in one frame than any scroll could carry it
         — a resize, or a late layout shift. Absorb it into the spring
         instead of letting it reach the screen as a jump. */
      ox = px - t.x; oy = py - t.y;
    } else if (reseed) {
      /* The hero has just placed this one by hand. Hand the gap to the
         spring: the drawn position does not move this frame at all, and the
         flight to the seat is the offset relaxing. The seat itself needs no
         such handling any more — it is a continuous function of scroll. */
      ox = px - t.x; oy = py - t.y;
      reseed = false;
    }

    relax(dt);
    const nx = t.x + ox, ny = t.y + oy;
    const mvx = nx - px, mvy = ny - py;
    px = nx; py = ny;
    // frame-rate independent easing: 1 - exp(-rate * dt), not a fixed share
    const ease = r => 1 - Math.exp(-r * dt);
    ps += (t.s - ps) * ease(6);

    // px per second, so the wing beat and the bank read the same at any
    // frame rate
    const speed = Math.hypot(mvx, mvy) / Math.max(dt, 1e-4);
    travel += (clamp01(speed / 700) - travel) * ease(6);

    // it points where it is going, and levels out when it stops
    const moving = speed > 45;
    const heading = moving ? Math.atan2(mvy, mvx) * 180 / Math.PI : 0;
    const wantRot = moving ? Math.max(-26, Math.min(26, heading * 0.22)) : 0;
    rot += (wantRot - rot) * ease(4);

    const s2 = now / 1000;
    // kept small, so the idle never carries it off the margin and over
    // whatever is being read
    const driftX = Math.sin(s2 * 0.8) * 3.5 + Math.sin(s2 * 2.1) * 1.2;
    const driftY = Math.cos(s2 * 1.0) * 4 + Math.sin(s2 * 2.6) * 1.4;
    // wings beat hard while it is working and idle when it is parked
    const beat = 1 - (0.12 + 0.36 * travel) *
      (0.5 + 0.5 * Math.sin(s2 * (5.5 + 10 * travel)));

    host.style.transform =
      "translate3d(" + (px + driftX - host.offsetWidth / 2).toFixed(1) + "px," +
      (py + driftY - host.offsetHeight / 2).toFixed(1) + "px,0)" +
      " rotate(" + rot.toFixed(2) + "deg) scale(" + ps.toFixed(3) + ")";
    flap(beat);
  }

  requestAnimationFrame(step);

  /* A synthetic clock, carried between calls, so a test can drive tick()
     forward by whole frames instead of by however long the loop took. */
  let simNow = 0;

  window.__flit = {
    get locked() { return locked(); },
    get markW() { return +MARK_FRAC.toFixed(4); },
    get drawn() { return !!drawArt; },
    /* the UNSCALED host width. box is the live rect and already carries the
       current scale, so sizing a snap from it compounds. */
    get hostW() { return host.offsetWidth; },
    /* drives the same tick() the real frame drives */
    tick(n, ms) {
      if (simNow < performance.now()) simNow = performance.now();
      for (let i = 0; i < (n || 1); i++) { simNow += (ms || 16.7); tick(simNow); }
      return { on: host.classList.contains("on"), at: this.at };
    },
    get at() { return { x: Math.round(px), y: Math.round(py),
                        s: +ps.toFixed(3), rot: +rot.toFixed(1) }; },
    /* which heading it is perched on, that heading's last-line box, and
       whether the butterfly's own box overlaps it */
    get perch() {
      perch();                       // refresh perchEl for this scroll position
      const el = perchEl;
      if (!el) return null;
      const b = lastLine(headBox(el) || el);
      const hw = host.offsetWidth * 0.5, hh = host.offsetHeight * 0.5;
      return {
        text: (el.textContent || "").trim().slice(0, 24),
        line: b ? { top: Math.round(b.top), bottom: Math.round(b.bottom),
                    left: Math.round(b.left), right: Math.round(b.right) } : null,
        onLine: !!b && py > b.top - hh && py < b.bottom + hh,
        overlapsText: !!b && (px - hw) < b.right && (px + hw) > b.left &&
                             (py - hh) < b.bottom && (py + hh) > b.top,
        onScreen: px > -hw && px < innerWidth + hw &&
                  py > -hh && py < innerHeight + hh
      };
    },
    get target() { const t = target();
      return { x: Math.round(t.x), y: Math.round(t.y), s: +t.s.toFixed(3) }; },
    get travel() { return +travel.toFixed(3); },
    get box() { const r = host.getBoundingClientRect();
      return [Math.round(r.left), Math.round(r.top),
              Math.round(r.width), Math.round(r.height)]; },
    /* every heading it could sit on right now, and where each one's last
       line ends — what a coverage sweep reads */
    get heads() { return heads().map(h => ({
      t: (h.el.textContent || "").trim().slice(0, 18),
      cy: Math.round(h.cy), right: Math.round(h.box.right) })); },
    settle(n) { this.tick(n || 120, 16.7); return this.at; },
    /* how far the drawn position is from its seat — 0 while it is sitting,
       non-zero only while it is flying between two headings */
    get offset() { return { x: +ox.toFixed(1), y: +oy.toFixed(1),
                            d: +Math.hypot(ox, oy).toFixed(1) }; },
    get flying() { return flying; },
    /* one full seat solve, timed */
    cost(n) {
      const N = n || 200, t0 = performance.now();
      for (let i = 0; i < N; i++) perch();
      return +((performance.now() - t0) / N).toFixed(4);
    }
  };

})();
</script>
</body>
</html>
