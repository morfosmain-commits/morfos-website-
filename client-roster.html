<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Client portal — MORFOS</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#000000;
  --surface:#121014;
  --surface-raised:#1c181d;
  --line:#2c262b;
  --line-soft:#1e1a1e;
  --ink:#f5f2ee;
  --ink-muted:#a79fa6;
  --ink-faint:#6f6870;
  --red:#fd2702;
  --red-soft:rgba(253,39,2,0.12);
  --amber:#e0a526;
  --amber-soft:rgba(224,165,38,0.14);
  --green:#35b37e;
  --green-soft:rgba(53,179,126,0.14);
  --slate:#8a8fa3;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Public Sans',-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --radius-lg:16px;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
::selection{background:var(--red);color:#fff;}
a{color:inherit;}
img{max-width:100%;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;} }

.wrap{max-width:960px;margin:0 auto;padding:0 20px 90px;position:relative;}

/* ---- Demo ribbon ---- */
.demo-ribbon{background:var(--amber-soft);color:var(--amber);border-bottom:1px solid rgba(224,165,38,.3);text-align:center;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;padding:8px 16px;text-transform:uppercase;}

/* ---- Topbar ---- */
.topbar{display:flex;align-items:center;gap:12px;padding:26px 20px 0;max-width:960px;margin:0 auto;}
.topbar img.cocoon{height:30px;width:auto;}
.topbar img.wordmark{height:17px;width:auto;margin-top:2px;}
.topbar .divider{width:1px;height:22px;background:var(--line);}
.topbar .label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);}

/* ---- Butterfly ---- */
.butterfly{display:inline-block;width:22px;height:auto;vertical-align:middle;flex:none;}
.perch{display:inline-flex;align-items:center;gap:9px;}
.hero-butterfly{
  position:absolute; width:46px; top:118px; left:6%;
  opacity:0; filter:drop-shadow(0 6px 14px rgba(253,39,2,.25));
}
.hero-butterfly.flying{
  animation: flight 3.4s cubic-bezier(.4,0,.2,1) 1 forwards;
}
@keyframes flight{
  0%{  opacity:0; transform: translate(0,0) rotate(-6deg) scale(.85); }
  8%{  opacity:1; }
  25%{ transform: translate(20vw,-38px) rotate(8deg) scale(1); }
  50%{ transform: translate(42vw,6px) rotate(-10deg) scale(.92); }
  75%{ transform: translate(63vw,-22px) rotate(6deg) scale(1.02); }
  94%{ opacity:1; }
  100%{ opacity:0; transform: translate(78vw,-4px) rotate(0deg) scale(.9); }
}

/* ---- Hero ---- */
.hero{padding:34px 0 8px;position:relative;overflow:hidden;}
.hero-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:10px;}
.hero h1{font-family:var(--font-display);font-weight:600;font-size:clamp(28px,5vw,42px);margin:0 0 14px;text-wrap:balance;}
.hero-meta{display:flex;flex-wrap:wrap;gap:26px;margin-top:22px;padding-top:20px;border-top:1px solid var(--line-soft);}
.hm-item{font-size:12.5px;color:var(--ink-faint);}
.hm-item b{display:block;color:var(--ink);font-size:14.5px;font-weight:600;margin-top:3px;font-family:var(--font-mono);}
.day-badge{display:inline-flex;align-items:center;gap:8px;background:var(--red-soft);color:#ff8a70;border:1px solid rgba(253,39,2,.3);padding:6px 14px;border-radius:20px;font-family:var(--font-mono);font-size:12.5px;font-weight:600;margin-bottom:18px;}
.day-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--red);}

.intro-note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:14px;color:var(--ink-muted);margin-top:22px;line-height:1.6;}
.intro-note b{color:var(--ink);}

/* ---- Section heading ---- */
.section{margin-top:52px;}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.section-head h2{font-family:var(--font-display);font-weight:600;font-size:21px;margin:0;}
.section-head .count-note{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);margin-left:auto;}

/* ---- Tabs ---- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-soft);margin:4px 0 24px;overflow-x:auto;}
.tab{font-family:var(--font-body);font-size:13.5px;font-weight:600;color:var(--ink-muted);background:none;border:none;padding:10px 4px;margin-right:26px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--ink);border-bottom-color:var(--red);}
.tab:hover{color:var(--ink);}
.pane{display:none;}
.pane.active{display:block;}

/* ---- Progress ---- */
.progress-wrap{margin-bottom:20px;}
.progress-label{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);margin-bottom:7px;display:flex;justify-content:space-between;}
.progress-track{width:100%;height:6px;border-radius:20px;background:var(--surface-raised);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--red),#ff8a4d);border-radius:20px;}

/* ---- Board (read only, responsive columns) ---- */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media (max-width:820px){.board{grid-template-columns:1fr 1fr;}}
@media (max-width:520px){.board{grid-template-columns:1fr;}}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:12px;}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 12px;}
.col-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:7px;color:var(--ink-muted);}
.dot{width:7px;height:7px;border-radius:50%;flex:none;}
.dot.todo{background:var(--slate);} .dot.progress{background:#5b9bf0;} .dot.waiting{background:var(--amber);} .dot.done{background:var(--green);}
.count{font-family:var(--font-mono);font-size:10px;font-weight:600;background:var(--surface-raised);color:var(--ink-muted);padding:2px 7px;border-radius:20px;}
.col-body{display:flex;flex-direction:column;gap:8px;min-height:20px;}
.col-empty{font-size:11px;color:var(--ink-faint);text-align:center;padding:14px 4px;}
.card{background:var(--surface-raised);border:1px solid var(--line);border-left:3px solid var(--slate);border-radius:9px;padding:10px 11px;font-size:12.5px;line-height:1.4;}
.col.todo .card{border-left-color:var(--slate);}
.col.progress .card{border-left-color:#5b9bf0;}
.col.waiting .card{border-left-color:var(--amber);}
.col.done .card{border-left-color:var(--green);opacity:.72;}
.col.done .card .card-title{text-decoration:line-through;text-decoration-color:var(--ink-faint);}
.col.waiting{background:rgba(224,165,38,.05);border-color:rgba(224,165,38,.25);}
.card-title{font-weight:600;color:var(--ink);}
.card-sub{font-size:11px;color:var(--ink-muted);margin-top:3px;}
.card-tags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;}
.tag{font-family:var(--font-mono);font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:20px;}
.tag.day{background:var(--surface);color:var(--ink-muted);border:1px solid var(--line);}
.tag.need{background:var(--amber-soft);color:var(--amber);}

/* ---- Link cards (deliverables / documents) ---- */
.link-grid{display:flex;flex-direction:column;gap:10px;}
.link-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 17px;text-decoration:none;transition:border-color .15s ease,background .15s ease;}
.link-card:hover{border-color:#3a333a;background:var(--surface-raised);}
.link-icon{width:36px;height:36px;border-radius:9px;background:var(--red-soft);color:#ff8a70;display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--font-mono);font-size:14px;}
.link-body{flex:1;min-width:0;}
.link-title{font-weight:600;font-size:14px;color:var(--ink);}
.link-note{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.link-go{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);flex:none;}

/* ---- Footer ---- */
footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--line-soft);text-align:center;color:var(--ink-faint);font-size:12.5px;}
footer .fnames{color:var(--ink-muted);margin-top:4px;}

/* ---- PIN gate ---- */
.gate{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;}
.gate.unlocked{display:none;}
.gate-card{max-width:340px;width:100%;text-align:center;}
.gate-card img.cocoon{height:44px;margin-bottom:18px;}
.gate-card h1{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0 0 6px;}
.gate-card p{color:var(--ink-muted);font-size:13px;margin:0 0 22px;}
.pin-input{margin-bottom:16px;}
.pin-input input{
  width:100%;height:56px;text-align:center;font-family:var(--font-mono);font-size:24px;font-weight:600;letter-spacing:.35em;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--ink);
}
.pin-input input::placeholder{color:var(--ink-faint);letter-spacing:.35em;}
.pin-input input:focus{outline:none;border-color:var(--red);}
.gate-error{color:#ff8a70;font-size:12.5px;min-height:18px;margin-bottom:10px;}
.gate-btn{font:inherit;font-weight:600;font-size:13.5px;padding:11px 20px;border-radius:9px;border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer;width:100%;}
.gate-btn:hover{background:#e42200;}
.gate-hint{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);margin-top:18px;}

.content{opacity:0;}
.content.revealed{opacity:1;animation:fadein .5s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ---- additions for the multi-client portal ---- */
.topbar .back-link{
  margin-left:auto;font-family:var(--font-mono);font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);
  text-decoration:none;transition:color .15s ease;
}
.topbar .back-link:hover{color:var(--ink);}
.section-head .perch h2{
  font-family:var(--font-display);font-weight:600;font-size:21px;margin:0;
}
[hidden]{display:none !important;}
</style>
</head>

async function sha256Hex(text){
  var enc = new TextEncoder().encode(text);
  var buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf))
    .map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
}

  COL_ORDER.forEach(function(col){
    var items = cards.filter(function(c){ return c.col === col; });
    var colEl = document.createElement("div");
    colEl.className = "col " + col;
    var body = items.map(function(c){
      var tags = '<span class="tag day">Day ' + escapeHtml(c.day) + '</span>'
        + (c.need ? '<span class="tag need">' + escapeHtml(c.need) + '</span>' : '');
      return '<div class="card"><div class="card-title">' + escapeHtml(c.title) + '</div>'
        + (c.sub ? '<div class="card-sub">' + escapeHtml(c.sub) + '</div>' : '')
        + '<div class="card-tags">' + tags + '</div></div>';
    }).join("") || '<div class="col-empty">Nothing here yet.</div>';
    colEl.innerHTML = '<div class="col-head"><div class="col-title"><span class="dot ' + col + '"></span>'
      + COL_LABELS[col] + '</div><div class="count">' + items.length + '</div></div>'
      + '<div class="col-body">' + body + '</div>';
    board.appendChild(colEl);
  });

  var total = cards.length;
  var done = cards.filter(function(c){ return c.col === "done"; }).length;
  var pct = total ? Math.round(done / total * 100) : 0;
  $("progress-text").textContent = done + " / " + total + " done";
  $("progress-pct").textContent = pct + "%";
  $("progress-fill").style.width = pct + "%";
  $("progress-note").textContent = "Updated by Morfos as work happens";
}

function renderLinks(gridId, items, iconLabel){
  var grid = $(gridId);
  grid.innerHTML = "";
  if (!items || !items.length){
    grid.innerHTML = '<div style="color:var(--ink-faint);font-size:13px;">Nothing here yet.</div>';
    return;
  }
  items.forEach(function(it){
    var a = document.createElement("a");
    a.href = it.url || "#";
    a.target = "_blank"; a.rel = "noopener";
    a.className = "link-card";
    a.innerHTML = '<div class="link-icon">' + iconLabel + '</div>'
      + '<div class="link-body"><div class="link-title">' + escapeHtml(it.label) + '</div>'
      + (it.note ? '<div class="link-note">' + escapeHtml(it.note) + '</div>' : '') + '</div>'
      + '<div class="link-go">Open →</div>';
    grid.appendChild(a);
  });
}

function renderClient(c){
  document.title = c.name + " — Morfos";
  $("client-name").textContent = c.name;
  $("day-badge-text").textContent = c.dayBadge || "";
  $("day-badge").hidden = !c.dayBadge;
  $("intro-note").textContent = c.intro || "";
  $("intro-note").hidden = !c.intro;
  $("demo-ribbon").hidden = !c.demo;
  $("foot-names").textContent = CONTACTS;

  var meta = $("hero-meta");
  meta.innerHTML = "";
  (c.meta || []).forEach(function(m){
    var d = document.createElement("div");
    d.className = "hm-item";
    d.innerHTML = escapeHtml(m.label) + "<b>" + escapeHtml(m.value) + "</b>";
    meta.appendChild(d);
  });

  renderBoard(c.cards || []);
  renderLinks("deliverables-grid", c.deliverables, "↓");
  renderLinks("documents-grid", c.documents, "▤");
}

function unlock(c){
  renderClient(c);
  $("gate").classList.add("unlocked");
  $("content").classList.add("revealed");
  setTimeout(function(){ $("hero-butterfly").classList.add("flying"); }, 250);
}

function wireGate(){
  var input = $("pin-single");
  var btn = $("gate-submit");
  var err = $("gate-error");

  input.addEventListener("input", function(){
    input.value = input.value.replace(/[^0-9]/g, "").slice(0, 6);
    err.textContent = "";
  });
  input.addEventListener("keydown", function(e){
    if (e.key === "Enter") btn.click();
  });

  btn.addEventListener("click", async function(){
    var pin = input.value.trim();
    if (pin.length < 4){
      err.textContent = "Enter your PIN, then press Unlock.";
      return;
    }
    btn.disabled = true;
    var hash = await sha256Hex(pin);
    btn.disabled = false;

    // whichever client's hash matches is the build we open
    var match = null;
    for (var i = 0; i < CLIENTS.length; i++){
      if (CLIENTS[i].pinHash === hash){ match = CLIENTS[i]; break; }
    }
    if (match){
      unlock(match);
    } else {
      err.textContent = "That PIN doesn't match. Check the message from Morfos and try again.";
      input.value = "";
      input.focus();
    }
  });

  input.focus();
}

function wireTabs(){
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  tabs.forEach(function(t){
    t.addEventListener("click", function(){
      tabs.forEach(function(x){ x.classList.toggle("active", x === t); });
      Array.prototype.slice.call(document.querySelectorAll(".pane")).forEach(function(p){
        p.classList.toggle("active", p.id === t.dataset.pane);
      });
    });
  });
}

wireTabs();
wireGate();

window.__portal = {
  get clients(){ return CLIENTS.map(function(c){ return c.slug; }); },
  get locked(){ return !$("gate").classList.contains("unlocked"); },
  open: function(slug){
    var c = CLIENTS.filter(function(x){ return x.slug === slug; })[0];
    if (c) unlock(c);
    return !!c;
  },
  hash: sha256Hex
};

})();

</script>
